<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RTI Query Assistant{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1E88E5;
            --success-color: #43A047;
            --warning-color: #FB8C00;
            --danger-color: #E53935;
            --info-color: #00897B;
        }
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .sidebar {
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            min-height: 100vh;
            padding: 20px 0;
            position: fixed;
            width: 280px;
        }
        .sidebar-title {
            color: white;
            font-size: 1.5rem;
            padding: 0 20px;
            margin-bottom: 10px;
        }
        .sidebar-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            padding: 0 20px;
            margin-bottom: 30px;
        }
        .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: 600;
        }
        .nav-link i {
            margin-right: 10px;
        }
        .main-content {
            margin-left: 280px;
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #eee;
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
        }
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background: #1565C0;
            border-color: #1565C0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        .badge-submitted { background-color: var(--primary-color) !important; color: #fff !important; }
        .badge-responded { background-color: var(--success-color) !important; color: #fff !important; }
        .badge-appealed { background-color: var(--warning-color) !important; color: #fff !important; }
        .badge-resolved { background-color: var(--info-color) !important; color: #fff !important; }
        .badge-overdue { background-color: var(--danger-color) !important; color: #fff !important; }
        .badge-denied { background-color: var(--danger-color) !important; color: #fff !important; }
        .badge-partial { background-color: var(--warning-color) !important; color: #fff !important; }
        .badge-allowed { background-color: var(--success-color) !important; color: #fff !important; }
        .badge-transferred { background-color: var(--primary-color) !important; color: #fff !important; }
        .badge-no_response { background-color: #6c757d !important; color: #fff !important; }
        .badge-no-response { background-color: #6c757d !important; color: #fff !important; }
        .badge-rejected { background-color: var(--danger-color) !important; color: #fff !important; }
        .example-btn {
            font-size: 0.85rem;
            padding: 8px 12px;
        }
        .alert-api {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            color: #e65100;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-title">⚖️ RTI Query Assistant</div>
            <div class="sidebar-subtitle">AI-powered Right to Information helper</div>
            <hr class="mx-3 bg-white opacity-25">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if page == 'file_rti' %}active{% endif %}" href="{{ url_for('file_rti') }}">
                        <i class="bi bi-pencil-square"></i> File RTI Application
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'know_your_rights' %}active{% endif %}" href="{{ url_for('know_your_rights') }}">
                        <i class="bi bi-lightbulb"></i> Know Your Rights
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'track_rti' %}active{% endif %}" href="{{ url_for('track_rti') }}">
                        <i class="bi bi-search"></i> Track My RTIs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'parse_response' %}active{% endif %}" href="{{ url_for('parse_response') }}">
                        <i class="bi bi-file-earmark-text"></i> Parse Government Response
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'draft_appeal' %}active{% endif %}" href="{{ url_for('draft_appeal') }}">
                        <i class="bi bi-lightning"></i> Draft Appeal Letter
                    </a>
                </li>
            </ul>
            <hr class="mx-3 bg-white opacity-25">
            <div class="px-3">
                <small class="text-white-50">
                    <strong>API Status</strong><br>
                    <a href="/health" class="text-white-50">Check health</a> |
                    <a href="http://localhost:8000/docs" class="text-white-50" target="_blank">API Docs</a>
                </small>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content flex-grow-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
