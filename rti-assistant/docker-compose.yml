version: "3.9"

services:
  rti-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: rti-assistant:latest
    container_name: rti-assistant
    ports:
      - "8000:8000"   # FastAPI + Flask UI at /ui
    volumes:
      - ./chroma_store:/app/chroma_store      # Persist RAG vector store
      - ./rti_tracker.db:/app/rti_tracker.db  # Persist SQLite DB
      - ./models:/app/models                  # Persist fine-tuned classifier
      - ./data:/app/data                      # Persist datasets
      - ./DATASET/uploads:/app/DATASET/uploads
    env_file: .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
